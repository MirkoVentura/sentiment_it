[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentiment-it"
version = "1.0.0"
description = "Sentiment analysis for Italian and English social media text using BERT models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Mirko Ventura" },
]
keywords = ["sentiment-analysis", "nlp", "bert", "italian", "sentipolc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "ekphrasis>=0.5.4",
    "emoji>=2.8",
    "gensim>=4.3",
    "lxml>=5.1",
    "matplotlib>=3.8",
    "nltk>=3.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "simpletransformers>=0.70",
    "torch>=2.1",
    "transformers>=4.37",
    "wordninja>=2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.urls]
Repository = "https://github.com/MirkoVentura/sentiment_it"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_it"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "N",     # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip without strict
    "N802",  # function name should be lowercase (research code convention)
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["sentiment_it"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
